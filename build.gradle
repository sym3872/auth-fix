plugins {
	// Java 소스 코드를 컴파일하고 테스트하는 기본 Gradle 기능을 사용한다.
	id 'java'
	// Spring Boot 애플리케이션을 실행하고 실행 가능한 jar를 만들기 위한 플러그인이다.
	id 'org.springframework.boot' version '4.1.0'
	// Spring Boot가 관리하는 라이브러리 버전을 자동으로 맞춰 주는 플러그인이다.
	id 'io.spring.dependency-management' version '1.1.7'
}

// 이 프로젝트가 속한 기본 그룹과 현재 학습용 버전이다.
group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		// 현재 컴퓨터에 설치된 Java 21을 사용한다. Spring Boot 4는 Java 17 이상이 필요하다.
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	// Spring Boot와 필요한 라이브러리를 내려받는 공개 저장소이다.
	mavenCentral()
}

dependencies {
	// HTTP 요청을 받는 REST API 컨트롤러를 만들기 위한 웹 기능이다.
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// User와 Post를 객체로 다루고 H2 데이터베이스에 저장하기 위한 JPA 기능이다.
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// 요청 값(이메일, 비밀번호 등)을 간단히 검증할 때 사용할 기능이다.
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// 브라우저에서 H2 데이터베이스 내용을 확인할 수 있는 학습용 콘솔 기능이다.
	implementation 'org.springframework.boot:spring-boot-h2console'
	// 프로그램이 실행되는 동안 메모리에서만 동작하는 설치 없는 데이터베이스다.
	runtimeOnly 'com.h2database:h2'

	// URL 접근 권한과 BCrypt 비밀번호 암호화를 제공하는 Spring Security 기능이다.
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// OpenAPI 명세와 Swagger UI를 자동 생성하는 라이브러리다.
	// Spring Boot 4와 호환되는 springdoc 3.x 버전을 사용한다.
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	// JWT 문자열을 만들고 검증하는 공개 라이브러리의 API 부분이다.
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	// JWT 실제 구현체는 컴파일할 때가 아니라 실행할 때만 필요하므로 runtimeOnly로 둔다.
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	// JWT 안의 JSON 내용을 읽고 쓰는 Jackson 구현체도 실행할 때만 필요하다.
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

	// 애플리케이션 시작과 각 기능을 테스트할 때 필요한 라이브러리들이다.
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	// Spring Security가 적용된 API의 권한 규칙을 테스트할 때 필요한 도구다.
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	// JUnit 5 방식으로 테스트를 실행한다.
	useJUnitPlatform()
}

tasks.named('bootRun') {
	// 터미널에서 bootRun을 실행할 때 숫자 메뉴가 키보드 입력을 받을 수 있게 한다.
	standardInput = System.in
}
